name: CI

# 这个仓库此前完全没有 CI（连 .github/ 目录都没有）：四套自检只能靠维护者在本地手跑，
# 于是「改了但忘了跑」没有任何机制兜住 —— docs/PUBLISHING.md 里那句"发布前要手动跑 verify"
# 就是这个缺口的自白。这里把最小可复现的几件事固化成门禁：
#   1. 类型检查（tsconfig.json 只覆盖标了 // @ts-check 的自研 Host 文件）
#   2. 三套冒烟：客户端结构 / 组件渲染 / host 侧纯函数与真实引擎
#   3. 客户端产物可复现（构建一遍，产物必须与仓库里已提交的 lib/client.js 逐字节一致）
#   4. 发布包形态（npm pack --dry-run，确认 files 白名单没漏东西、也没多带东西）
#
# 步骤名称里刻意**不写断言条数**：那会变成又一处"改了测试就得记得同步"的地方
# （T专家 那边就为此专门写了一条自检去对齐 README 与 ci.yml 里的数字）。
#
# 注意：本仓库是**本地插件仓库**，@deepseek-ai/* 与 react 由 DSH 宿主在运行期提供，
# 这里只装开发期依赖（.npmrc 里开了 legacy-peer-deps，原因见该文件注释）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (dev only)
        run: npm ci --ignore-scripts
      # 标了 // @ts-check 的文件必须真的被 tsc 读到：host-smoke 里有一条断言盯这个不变量，
      # 而这一步是它真正发挥作用的地方（0.12.0 第一次跑就抓出两个真问题）。
      - name: Typecheck
        run: npm run typecheck
      # 客户端结构冒烟：设置卡片的分组与顺序、槽位注册、样式表结构、投递加固两项的呈现。
      - name: Client smoke
        run: npm run smoke
      # 组件渲染冒烟：把每个组件真的渲染一遍。上面那条是结构断言，这条能抓住
      # "只在渲染时才炸"的问题（引用了别的组件的局部变量一类）。
      - name: Client render smoke
        run: npm run render-smoke
      # host 侧冒烟：投递编排、图片嗅探、HTTP 信任闸、重启安全闸，以及用真实调度引擎跑的
      # 定时任务用例（含执行窗口并发变更、迁移诊断、损坏文件留存）。
      # 全部用临时目录与 mock 服务，不碰真实账号目录、不发起真实网络请求、不动进程控制。
      - name: Host smoke
        run: npm run host-smoke
      # 产物可复现：构建一遍，并断言已提交的 lib/client.js 与构建结果逐字节一致。
      # 为什么要有：改了 src/client/ 下的源码却忘记 `npm run build` 时，仓库里那份产物会
      # 悄悄落后于源码 —— 装到宿主上跑的是产物，于是"改了没生效"且没有任何报错。
      - name: Client bundle is reproducible
        run: |
          npm run build
          git diff --exit-code -- lib/client.js
      - name: Package shape
        run: npm pack --dry-run --ignore-scripts
